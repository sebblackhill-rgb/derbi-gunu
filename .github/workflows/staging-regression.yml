name: Staging regression checks
on:
  push:
    branches: [codex/stabilization-20261119, codex/v17-cinematic-20261120, codex/v18-gameplay-20261120, codex/v19-rally-20261120, codex/v20-release-20261120, codex/v201-desktop-rehearsal-20261120]
  pull_request:
    branches: [main, codex/stabilization-20261119]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Derbi runtime
        run: node --check js/game.js
      - name: Source-anchored regression checks
        run: |
          node --test tests/stabilization.test.mjs
          node --test tests/v20-ops-contract.test.mjs
          node --test tests/v201-rehearsal-contract.test.mjs
      - name: Archive exact v2.0.1 rehearsal staging game for offline review
        uses: actions/upload-artifact@v4
        with:
          name: derbi-v201-desktop-game
          path: |
            index.html
            styles.css
            js/
            lib/
            assets/
            .nojekyll
            howto.mp4
            tests/
          if-no-files-found: error
          retention-days: 30

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install minimal Chrome browser test driver
        run: npm install --no-save --no-audit --no-fund playwright-core@1.58.2
      - name: Launch local static staging site and check responsive browser behavior
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/derbi-staging-http.log 2>&1 &
          sleep 2
          timeout 170s node tests/staging-browser.mjs
          timeout 120s node tests/natural-soak-browser.mjs
          timeout 170s node tests/match-cycle-browser.mjs
          timeout 120s node tests/visual-choreography-browser.mjs
          timeout 120s node tests/v17-cinematic-browser.mjs
          timeout 150s node tests/v18-viewer-browser.mjs
          timeout 150s node tests/v19-finale-browser.mjs
          timeout 150s node tests/v20-obs-browser.mjs
          timeout 150s node tests/v20-live-mock-browser.mjs
          timeout 150s node tests/v201-desktop-browser.mjs
      - name: Upload browser screenshots for remote review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: derbi-chromium-staging-evidence
          path: |
            browser-evidence/*.png
            browser-evidence/*.json
          if-no-files-found: warn
          retention-days: 14
